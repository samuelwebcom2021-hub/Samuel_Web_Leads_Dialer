plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.android.legacy-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.tuempresa.autodialer'
    compileSdk 35

    defaultConfig {
        applicationId "com.tuempresa.autodialer"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Base de datos local (Room)
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'com.google.firebase:firebase-auth:24.2.0'
    implementation 'com.google.firebase:firebase-firestore:26.6.0'
    kapt 'androidx.room:room-compiler:2.8.4'

    // Lectura de archivos .xlsx y .xls (Apache POI)
    implementation('org.apache.poi:poi:5.3.0') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    implementation('org.apache.poi:poi-ooxml:5.3.0') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    implementation 'com.fasterxml:aalto-xml:1.4.0'
    
    // Redirigir Log4j a SLF4J para evitar crash LambdaMetafactory en Android
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.20.0'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    
    // Lectura de archivos .csv (OpenCSV)
    implementation 'com.opencsv:opencsv:5.9'

    // Dependencia anterior (será eliminada cuando se migre todo a Apache POI)
    // implementation 'org.dhatim:fastexcel-reader:0.16.6'

    // Gráficas
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Inicio de sesión con Google (usado como identidad para Firebase Auth)
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    // DataStore para Ajustes reactivos
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
